# TEMPLATE: copy this file to your project's .github/workflows/ and adjust as
# needed. It is NOT yet published as a reusable workflow at
# netresearch/php-modernization-skill/.github/workflows/* — that lives in the
# typo3-ci-workflows meta-package or can be added there once stable.
#
# Consumers should pin third-party actions to a SHA in production. The major
# tags below (@v2, @v3, @v4, @v6) are convenient defaults but allow upstream
# changes through; replace with `<owner>/<repo>@<sha> # <tag>` for SLSA-grade
# supply-chain hygiene. The `# nosemgrep: github-actions-mutable-action-tag`
# markers on those lines record that
# the mutable default is intentional for this template so SAST does not flag
# it — drop the marker when you pin to a SHA.
#
# Local consumption:
#   cp skills/php-modernization/templates/github-actions/php-modernization.yml \
#     .github/workflows/php-modernization.yml
#   # then edit `php-version` to match your project's PHP requirement.
---
name: php-modernization

"on":
  workflow_call:
    inputs:
      php-version:
        description: PHP version for the verifier and orchestrator runs
        required: false
        default: "8.3"
        type: string
      enable-sarif:
        description: Emit SARIF and upload to GitHub code scanning
        required: false
        default: false
        type: boolean
      enable-infection-diff:
        description: Run Infection in PR diff-mode against the base ref
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  verify:
    name: Verify and orchestrate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4  # nosemgrep: github-actions-mutable-action-tag
        with:
          # Infection diff-mode needs the base branch in history.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2  # nosemgrep: github-actions-mutable-action-tag
        with:
          php-version: ${{ inputs.php-version }}
          # Infection needs a coverage driver (pcov, phpdbg or xdebug) for the
          # PR diff run; without one it stops before mutating anything. pcov
          # is enough: Infection reads line coverage.
          coverage: pcov
          tools: composer:v2

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install uv
        uses: astral-sh/setup-uv@v6  # nosemgrep: github-actions-mutable-action-tag
        with:
          enable-cache: true

      - name: Run verifier (JSON)
        id: verify-json
        run: |
          # Without pipefail the exit code of tee hides a failing verifier
          set -o pipefail
          uv run skills/php-modernization/scripts/verify_php_project.py \
            --root . --format json | tee php-modernization-report.json

      # The steps below report; !cancelled() keeps them running after a
      # failing verifier or orchestrator step, so the job is red and still
      # produces the SARIF upload, the artifacts and the PR comment. They are
      # skipped when the JSON verifier was skipped, i.e. a setup step failed,
      # so the root cause is not buried under secondary failures.
      - name: Run verifier (SARIF)
        id: sarif
        if: ${{ !cancelled() && steps.verify-json.outcome != 'skipped' && inputs.enable-sarif }}
        run: |
          set -o pipefail
          rc=0
          uv run skills/php-modernization/scripts/verify_php_project.py \
            --root . --format sarif | tee php-modernization.sarif || rc=$?
          # Upload only a complete SARIF document: a crash leaves an empty or
          # partial file, a failing verifier (exit 1) a complete one.
          if python3 -c 'import json,sys; json.load(open(sys.argv[1]))' php-modernization.sarif 2>/dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && steps.sarif.outputs.valid == 'true' }}
        uses: github/codeql-action/upload-sarif@v3  # nosemgrep: github-actions-mutable-action-tag
        with:
          sarif_file: php-modernization.sarif
          category: php-modernization

      - name: Run orchestrator (dry-run)
        if: ${{ !cancelled() && steps.verify-json.outcome != 'skipped' && inputs.enable-infection-diff && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Without pipefail the exit code of tee hides a failing gate
          set -o pipefail
          uv run skills/php-modernization/scripts/modernize_loop.py \
            --mode dry-run \
            --git-diff-base="origin/${BASE_REF}" \
            | tee modernize-loop.json

      - name: Run orchestrator (dry-run, no infection)
        if: ${{ !cancelled() && steps.verify-json.outcome != 'skipped' && (!inputs.enable-infection-diff || github.event_name != 'pull_request') }}
        run: |
          set -o pipefail
          uv run skills/php-modernization/scripts/modernize_loop.py \
            --mode dry-run \
            --tools rector,php-cs-fixer,phpcs,lint,phpstan,phpunit \
            | tee modernize-loop.json

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4  # nosemgrep: github-actions-mutable-action-tag
        with:
          name: php-modernization-${{ github.run_id }}
          path: |
            php-modernization-report.json
            php-modernization.sarif
            modernize-loop.json
            .build/php-modernization/
          if-no-files-found: ignore

      # One marked comment per pull request, updated on every push. Skipped for
      # pull requests from forks, whose token cannot write comments.
      - name: PR summary comment
        if: ${{ !cancelled() && steps.verify-json.outcome != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          uv run skills/php-modernization/scripts/verify_php_project.py \
            --root . --format json --summary --no-cache > php-modernization-summary.json \
            || [ "$?" = 1 ]  # exit 1 = failures found; the status below decides

          status=$(python3 -c 'import json,sys; print(json.load(open("php-modernization-summary.json")).get("summary",{}).get("status","fail"))')
          marker='<!-- php-modernization-verifier -->'
          comment_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | tail -n 1)
          if [ "$status" = "fail" ]; then
            {
              echo "$marker"
              echo "### php-modernization verifier — failures detected"
              echo
              echo '```json'
              cat php-modernization-summary.json
              echo '```'
            } > php-modernization-comment.md
          elif [ -n "$comment_id" ]; then
            # An earlier push reported failures; say they are gone
            {
              echo "$marker"
              echo "### php-modernization verifier — no failures"
            } > php-modernization-comment.md
          else
            exit 0
          fi
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@php-modernization-comment.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file php-modernization-comment.md
          fi
